<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>축구선수 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Black+Han+Sans&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a sticky player registration card on the left (mown-pitch header, kit number, attributes, money),
   a matchday report feed on the right with three tabs; stacks to one column on phones. */
:root{
  --bg:#e7ece5; --surface:#f7f9f5; --sunk:#dce4da; --ink:#13241a; --muted:#56685b; --line:#c5d0c5;
  --pitch:#1d5838; --pitch2:#226540; --chalk:#f1f6ef; --accent:#e0ad08; --accent-ink:#1b1500;
  --up:#16794a; --down:#bd3628; --warn:#9a6a00;
  --disp:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --num:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
:root:lang(ja){
  --disp:'Dela Gothic One','IBM Plex Sans JP',sans-serif;
  --body:'IBM Plex Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1611; --surface:#132019; --sunk:#1b2b22; --ink:#e3ece5; --muted:#93a698; --line:#26392d;
    --pitch:#1a4d32; --pitch2:#1f5838; --chalk:#eef5ee; --accent:#f0c33f; --accent-ink:#1b1500;
    --up:#4cc07e; --down:#ef6c5c; --warn:#e0b04a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1611; --surface:#132019; --sunk:#1b2b22; --ink:#e3ece5; --muted:#93a698; --line:#26392d;
  --pitch:#1a4d32; --pitch2:#1f5838; --chalk:#eef5ee; --accent:#f0c33f; --accent-ink:#1b1500;
  --up:#4cc07e; --down:#ef6c5c; --warn:#e0b04a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pitch);color:var(--chalk);
  display:flex;align-items:center;gap:12px;padding-block:10px;padding-inline:16px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:16px;background:var(--accent);border-radius:2px;transform:rotate(-8deg)}
.datechip{font-family:var(--num);font-size:16px;font-weight:600;letter-spacing:.04em;opacity:.92}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--chalk) 35%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 11px;font-size:13px;color:var(--chalk)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--pitch)}
.ghost{background:none;border:1px solid color-mix(in srgb,var(--chalk) 35%,transparent);color:var(--chalk);border-radius:999px;padding:3px 12px;font-size:13px}
.banner{background:var(--accent);color:var(--accent-ink);padding-block:10px;padding-inline:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner button{border:1px solid var(--accent-ink);background:none;border-radius:6px;padding:4px 12px;color:var(--accent-ink)}
.banner button.solid{background:var(--accent-ink);color:var(--accent)}

.page{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:500}
.btn.pri{background:var(--pitch);color:var(--chalk);border-color:var(--pitch)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:13px}

/* title */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:28px}
.hero h1{font-size:clamp(40px,8vw,76px);line-height:1.05}
.hero .tag{font-size:17px;color:var(--muted);max-width:34em;margin-top:14px}
.hero .acts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.minipitch{aspect-ratio:68/105;max-width:300px;width:100%;margin-inline:auto;border-radius:6px;position:relative;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 8.33%,var(--pitch2) 8.33% 16.66%);box-shadow:0 1px 0 var(--line)}
.minipitch::before{content:"";position:absolute;inset:4%;border:2px solid color-mix(in srgb,var(--chalk) 75%,transparent);border-radius:2px}
.minipitch::after{content:"";position:absolute;left:4%;right:4%;top:50%;border-top:2px solid color-mix(in srgb,var(--chalk) 75%,transparent)}
.minipitch .cc{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:2px solid color-mix(in srgb,var(--chalk) 75%,transparent);border-radius:50%;transform:translate(-50%,-50%)}
.minipitch .box{position:absolute;left:25%;right:25%;height:14%;border:2px solid color-mix(in srgb,var(--chalk) 75%,transparent)}
.minipitch .box.t{top:4%;border-top:0}.minipitch .box.b{bottom:4%;border-bottom:0}
.saveinfo{font-size:13px;color:var(--muted);margin-top:10px}

/* create */
.form{display:grid;gap:22px;max-width:880px}
.fld>label,.fld>.lbl{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:500}
.fld .hint{font-size:13px;color:var(--muted);margin-top:6px}
.inp{width:100%;max-width:360px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--pitch);background:var(--pitch);color:var(--chalk)}
.chip .code{font-family:var(--num);font-weight:700;letter-spacing:.06em;font-size:13px;opacity:.75}
.nat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nat .chip{justify-content:flex-start}
.nat .eu{margin-left:auto;font-size:10px;font-family:var(--num);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:3px}
.posgrid{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:18px;align-items:start}
.pp{position:relative;aspect-ratio:68/80;width:100%;max-width:240px;border-radius:6px;background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch2) 10% 20%)}
.pp::before{content:"";position:absolute;inset:5%;border:2px solid color-mix(in srgb,var(--chalk) 70%,transparent);border-bottom:0}
.pp .box{position:absolute;left:25%;right:25%;top:5%;height:16%;border:2px solid color-mix(in srgb,var(--chalk) 70%,transparent);border-top:0}
.pp button{position:absolute;transform:translate(-50%,-50%);border-radius:999px;border:2px solid var(--chalk);background:color-mix(in srgb,var(--pitch) 70%,#000);color:var(--chalk);
  font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.05em;padding:3px 9px}
.pp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.posdesc{font-size:14px}
.posdesc b{font-family:var(--disp);font-weight:400;font-size:20px;display:block;margin-bottom:4px}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fcard{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;display:grid;gap:6px}
.fcard[aria-pressed="true"]{border-color:var(--pitch);box-shadow:inset 0 0 0 1px var(--pitch)}
.fcard .fn{font-family:var(--num);font-weight:700;font-size:20px}
.fcard svg{width:100%;height:auto;color:var(--pitch)}
.fcard .fs{font-size:12px;color:var(--muted);line-height:1.4}

/* academy */
.acad{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;align-content:start}
.acard .hd{display:flex;gap:12px;align-items:center}
.acard .cn{font-family:var(--num);font-weight:700;font-size:22px;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.tagx{display:inline-block;font-size:11px;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.tagx.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* game */
.game{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.pcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pc-top{background:repeating-linear-gradient(90deg,var(--pitch) 0 24px,var(--pitch2) 24px 48px);color:var(--chalk);padding:14px 16px 16px;position:relative}
.pc-club{display:flex;align-items:center;gap:10px;font-size:13px}
.pc-club b{font-family:var(--num);font-size:17px;font-weight:700;display:block;line-height:1.1}
.pc-main{display:flex;align-items:flex-end;gap:12px;margin-top:12px}
.kit{font-family:var(--num);font-weight:700;font-size:64px;line-height:.85;color:var(--accent)}
.pc-name{font-family:var(--disp);font-size:20px;line-height:1.2}
.pc-sub{font-size:13px;opacity:.85;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{display:inline-block;font-size:11px;letter-spacing:.06em;border-radius:4px;padding:1px 6px;background:color-mix(in srgb,var(--chalk) 18%,transparent)}
.pill.y{background:var(--accent);color:var(--accent-ink)}
.pc-ovr{display:flex;align-items:baseline;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pc-ovr .big{font-family:var(--num);font-weight:700;font-size:52px;line-height:1}
.pc-ovr .lab{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.pc-ovr .side{display:grid;gap:2px;margin-left:auto;text-align:right;font-size:13px}
.attrs{padding:12px 16px;display:grid;gap:7px;border-bottom:1px solid var(--line)}
.attr{display:grid;grid-template-columns:62px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pitch)}
:root:not([data-theme="light"]) .bar i{background:color-mix(in srgb,var(--up) 80%,var(--pitch))}
.attr .v{font-family:var(--num);font-weight:600;font-size:16px;text-align:right}
.econ{padding:12px 16px;display:grid;gap:8px;font-size:13px}
.econ .r{display:flex;justify-content:space-between;gap:8px}
.econ .r b{font-family:var(--num);font-size:17px;font-weight:600}
.fame{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fame i{display:block;height:100%;background:var(--accent)}
.injbox{margin:0 16px 14px;padding:8px 10px;border-radius:6px;background:color-mix(in srgb,var(--down) 12%,var(--surface));color:var(--down);font-size:13px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}

/* report */
.rep{display:grid;gap:22px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.headline{font-size:clamp(22px,3.2vw,30px);margin-top:6px}
.byline{font-size:13px;color:var(--muted);margin-top:6px;font-style:italic}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.kpi{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi .k{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-family:var(--num);font-weight:700;font-size:26px;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted)}
.sec{display:grid;gap:10px;min-width:0}
.sec>h3{font-size:16px;display:flex;align-items:center;gap:10px}
.sec>h3::after{content:"";flex:1;border-top:1px solid var(--line)}
.prose{max-width:68ch;display:grid;gap:8px}
.news{display:grid;gap:6px}
.news div{padding:8px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 6px 6px 0;font-size:14px}
.quote{font-size:15px;max-width:68ch;padding:12px 16px;background:var(--surface);border-radius:8px;border:1px solid var(--line)}
.quote .who{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.keym{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;max-width:76ch}
.keym .mh{font-family:var(--num);font-weight:600;font-size:16px;letter-spacing:.02em;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.keym .sc{font-size:22px;font-weight:700}
.keym ul{margin:0;padding-left:18px;display:grid;gap:3px}
.keym .stl{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--num);font-size:15px;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.dim td{color:var(--muted)}
tr.me td{background:color-mix(in srgb,var(--accent) 16%,var(--surface));font-weight:600}
.comp{font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.04em}
.res{display:inline-block;width:18px;text-align:center;border-radius:3px;font-family:var(--num);font-weight:700;font-size:12px;color:#fff;margin-right:6px}
.res.W{background:var(--up)} .res.D{background:var(--muted)} .res.L{background:var(--down)}
.rt{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:0 4px;font-family:var(--num);font-weight:700;font-size:14px}
.rt.r8{background:var(--up);color:#fff}
.rt.r7{background:color-mix(in srgb,var(--up) 22%,var(--surface));color:var(--up)}
.rt.r6{background:var(--sunk)}
.rt.r5{background:color-mix(in srgb,var(--down) 18%,var(--surface));color:var(--down)}
.ga{font-family:var(--num);font-weight:600}
.dl{font-family:var(--num);font-weight:700}
.money td:last-child{text-align:right;font-family:var(--num);font-size:15px}
.money tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.offlist{display:grid;gap:8px}
.offlist div{font-size:14px;padding-left:12px;border-left:2px solid var(--line)}
.se{background:var(--surface);border:2px solid var(--pitch);border-radius:12px;padding:16px;display:grid;gap:12px}
.trow{display:flex;gap:8px;flex-wrap:wrap}
.trophy{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700}
.trophy svg{width:14px;height:14px}
.award{display:inline-flex;border:1px solid var(--pitch);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:500}
.empty{padding:28px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}

/* plan */
.plan{display:grid;gap:24px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;display:grid;gap:3px;align-content:start}
.opt[aria-pressed="true"]{border-color:var(--pitch);box-shadow:inset 0 0 0 1.5px var(--pitch)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .on{font-weight:700;font-size:14px}
.opt .od{font-size:12.5px;color:var(--muted);line-height:1.45}
.opt .oc{font-family:var(--num);font-weight:600;font-size:15px}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.ocard .hd{display:flex;gap:10px;align-items:center}
.ocard .cn{font-family:var(--num);font-weight:700;font-size:20px;line-height:1.1}
.ocard .q{font-size:13.5px;line-height:1.5}
.ocard .ag{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.window{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:16px;display:grid;gap:14px}
.planfoot{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.planfoot .sum{font-size:13px;color:var(--muted);flex:1;min-width:200px}
.planfoot .sum b{color:var(--ink);font-family:var(--num);font-size:16px}
.holdings{font-size:13px;display:grid;gap:4px}
.retire{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface)}

/* end */
.endhero{background:repeating-linear-gradient(90deg,var(--pitch) 0 30px,var(--pitch2) 30px 60px);color:var(--chalk);border-radius:14px;padding:26px 22px;display:grid;gap:10px}
.endhero .gr{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:var(--disp);padding:4px 12px;border-radius:6px;font-size:18px;justify-self:start}
.endhero h1{font-size:clamp(30px,6vw,52px)}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details>summary{cursor:pointer;padding:10px 14px;font-weight:500}
details>.in{padding:6px 14px 16px;display:grid;gap:16px}

@media (max-width:860px){
  .game{grid-template-columns:minmax(0,1fr)}
  .pcard{position:static}
  .hero{grid-template-columns:minmax(0,1fr)}
  .minipitch{max-width:200px}
}
@media (max-width:520px){
  .posgrid{grid-template-columns:minmax(0,1fr)}
  .pp{max-width:260px}
  .kpi .v{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){
  .rep{animation:rise .35s ease-out both}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>

<div id="app"></div>

<script>
'use strict';
/* ================= utilities ================= */
const rnd=Math.random;
const rand=(a,b)=>a+rnd()*(b-a);

 ja:[()=>`「この3か月、チームで最も安定していた選手です。ボールを失って5秒以内に再びプレスをかけた回数はチームトップ。このリズムなら、より大きな舞台も時間の問題でしょう」`,()=>`「正直、期待以上です。試合ごとに相手の分析資料を自分から求めてくる選手は初めて見ました。監督として、こういう選手は宝です」`,()=>`「私の戦術で最も代えのきかない選手になりました。他クラブから問い合わせが来ているのも知っています。だからこそ慎重に起用します」`]},
mgr_good:{ko:[()=>`“전술 이해도가 확실히 올라왔어요. 다만 70분 이후 집중력은 아직 숙제입니다. 체력 코치와 따로 프로그램을 짰습니다.”`,()=>`“좋은 3개월이었습니다. 이제 ‘좋은 선수’에서 ‘경기를 결정하는 선수’로 넘어갈 때예요. 그 차이는 경기를 바꾸는 한 장면에서 나옵니다.”`,()=>`“꾸준했습니다. 동료들이 믿고 공을 맡기기 시작했어요. 그게 숫자보다 더 중요한 신호입니다.”`],
 ja:[()=>`「戦術理解度は確実に上がりました。ただ70分以降の集中力はまだ課題。フィジカルコーチと別メニューを組みました」`,()=>`「良い3か月でした。そろそろ『良い選手』から『試合を決める選手』へ移る時期です。その差は試合を変える一場面で生まれます」`,()=>`「安定していました。チームメイトが安心してボールを預けるようになった。それは数字以上に大事なサインです」`]},
mgr_avg:{ko:[()=>`“나쁘지 않았습니다. 하지만 ‘나쁘지 않다’로는 이 팀에서 오래 못 버팁니다. 다음 3개월은 더 보여줘야 해요.”`,()=>`“훈련 태도는 좋습니다. 경기에서 그게 다 나오지 않을 뿐이죠. 자신감 문제라고 봅니다.”`,()=>`“포지션 경쟁은 계속됩니다. 지금은 누구도 확정이 아니에요. 본인도 그걸 알 겁니다.”`],
 ja:[()=>`「悪くはなかった。ですが『悪くない』ではこのチームで長くは生き残れません。次の3か月はもっと見せてもらわないと」`,()=>`「練習での姿勢は素晴らしい。それが試合で出し切れていないだけ。自信の問題だと見ています」`,()=>`「ポジション争いは続きます。今は誰も確定ではありません。本人も分かっているはずです」`]},
mgr_poor:{ko:[()=>`“솔직히 실망스럽습니다. 볼 터치 후 판단이 반 박자씩 늦어요. 영상 분석 세션을 주 2회로 늘렸습니다.”`,()=>`“지금은 힘든 시기입니다. 제가 영입을 원했던 이유는 여전히 유효해요. 다만 시간이 무한하진 않습니다.”`,()=>`“실수가 반복되면 결국 선택지에서 밀립니다. 프로의 세계는 그렇게 냉정해요.”`],
 ja:[()=>`「正直、期待外れです。トラップ後の判断が半拍ずつ遅い。映像分析のセッションを週2回に増やしました」`,()=>`「今は苦しい時期です。私が獲得を望んだ理由は今も変わりません。ただ、時間は無限ではない」`,()=>`「ミスが繰り返されれば、いずれ選択肢から外れていく。プロの世界はそれほど冷酷です」`]},
mgr_bench:{ko:[()=>`“기회는 줄 수 있는 만큼 줬다고 생각합니다. 경쟁자들이 너무 잘하고 있어요. 훈련장에서 저를 설득해야 합니다.”`,()=>`“아직 이 레벨의 템포에 적응 중입니다. 서두르지 않을 겁니다. 다만 본인이 원하면 임대도 열려 있는 선택지예요.”`,()=>`“스쿼드 경쟁에서 지금은 뒤에 있습니다. 숫자로 증명할 시간이 필요하겠죠.”`],
 ja:[()=>`「与えられるだけのチャンスは与えたつもりです。競争相手の出来が良すぎる。練習場で私を説得してほしい」`,()=>`「まだこのレベルのテンポに適応している最中です。急がせるつもりはありません。ただ本人が望むなら、レンタルも選択肢の一つです」`,()=>`「スカッド内の競争では今は後ろにいます。数字で証明する時間が必要でしょう」`]},
mgr_injured:{ko:[()=>`“부상이 가장 아쉬웠죠. 의료진과 복귀 일정을 서두르지 않기로 합의했습니다. 몸이 먼저입니다.”`,()=>`“재활 과정에서 보여준 태도는 훌륭했습니다. 돌아오면 바로 경쟁에 다시 들어갈 겁니다.”`],
 ja:[()=>`「負傷が一番の痛手でした。メディカルスタッフと復帰を急がないことで合意しています。まずは体です」`,()=>`「リハビリ中の姿勢は見事でした。戻ればすぐに競争に加わるでしょう」`]},
mgr_youth:{ko:[()=>`“피지컬은 아직 성인 무대에 부족하지만, 오프 더 볼 움직임은 이 연령대에서 손꼽힙니다. 1군 코치진도 제 보고서를 읽고 있어요.”`,()=>`“또래 중 가장 먼저 훈련장에 나오는 선수입니다. 기술은 가르칠 수 있지만 그런 습관은 가르칠 수 없죠.”`,p=>`“이번 분기 과제는 ${p.weak} 사용이었습니다. 약발 패스 성공률이 눈에 띄게 올랐어요.”`],
 ja:[()=>`「フィジカルはまだ大人の舞台には足りませんが、オフ・ザ・ボールの動きはこの年代で指折りです。トップのコーチ陣も私のレポートを読んでいます」`,()=>`「同世代で一番早く練習場に来る選手です。技術は教えられますが、ああいう習慣は教えられません」`,p=>`「今期の課題は${p.weak}の使用でした。逆足でのパス成功率が目に見えて上がっています」`]},
mgr_youth_low:{ko:[()=>`“지금은 동기들에게 밀려 있지만, 아카데미에서 순서는 자주 바뀝니다. 조급해하지 말라고 했어요.”`,()=>`“몸이 아직 덜 자랐습니다. 지금은 웨이트보다 기본기에 집중할 시기예요.”`],
 ja:[()=>`「今は同期に後れを取っていますが、アカデミーでの序列はよく入れ替わります。焦るなと伝えました」`,()=>`「体がまだ出来上がっていません。今はウエイトより基本技術に集中する時期です」`]},
fan_high:{ko:[p=>`경기 하이라이트 영상 조회수 ${p.views}회. 팬 포럼 ‘이번 분기 MVP’ 투표에서 ${p.pct}% 득표.`,p=>`구단 공식 스토어 유니폼 마킹 판매 팀 내 ${p.rank}위. 홈 경기마다 ${p.n}의 응원가가 울린다.`],
 ja:[p=>`ハイライト動画の再生回数は${p.views}回。サポーター掲示板の「今期MVP」投票で${p.pct}%を獲得。`,p=>`クラブ公式ストアのユニフォームネーム売上はチーム${p.rank}位。ホームゲームのたびに${p.n}のチャントが響く。`]},
fan_mid:{ko:[p=>`팬 커뮤니티 반응은 ‘가능성은 확실히 보인다’가 다수. SNS 팔로워 ${p.fol} (${p.dfol}).`,p=>`현지 팬 투표 이번 분기 평가 ${p.fr}/10. “다음 시즌이 더 기대된다”는 댓글이 가장 많은 공감을 받았다.`],
 ja:[p=>`サポーターの反応は「可能性は確かに見える」が多数。SNSフォロワー${p.fol}（${p.dfol}）。`,p=>`地元ファン投票の今期採点は${p.fr}/10。「来季がもっと楽しみ」というコメントが最も多くの共感を集めた。`]},
fan_low:{ko:[()=>`‘왜 계속 기용하냐’는 글이 팬 포럼 인기글에 올랐다. 그래도 원정 응원단은 여전히 이름을 불러준다.`,()=>`SNS 댓글창이 거칠어졌다. 에이전트는 당분간 댓글을 보지 말라고 조언했다.`],
 ja:[()=>`「なぜ起用し続けるのか」という投稿が掲示板の人気スレッドに。それでもアウェーの応援団はまだ名前を叫んでくれる。`,()=>`SNSのコメント欄が荒れている。代理人はしばらくコメントを見ないよう助言した。`]},
fan_quiet:{ko:[p=>`아직 관중석에서 그의 이름을 아는 사람은 많지 않다. SNS 팔로워 ${p.fol}.`,()=>`지역 신문 하단에 짧게 이름이 실렸다. 가족 단톡방에서는 그 기사 캡처가 하루 종일 돌았다.`],
 ja:[p=>`スタンドで彼の名前を知る人はまだ多くない。SNSフォロワー${p.fol}。`,()=>`地元紙の片隅に名前が小さく載った。家族のグループチャットでは、その記事のスクショが一日中回っていた。`]},
grow_big:{ko:[p=>`분석팀 리포트: 종합 능력치 ${p.o0} → ${p.o1}. 이번 분기 성장 폭은 구단 데이터 기준 상위 5%.`,p=>`퍼포먼스 디렉터: “훈련 부하를 올렸는데도 회복 지표가 오히려 좋아졌습니다. 몸이 한 단계 올라섰어요.” (${p.o0} → ${p.o1})`],
 ja:[p=>`分析チームのレポート：総合値${p.o0} → ${p.o1}。今期の伸び幅はクラブのデータで上位5%。`,p=>`パフォーマンスディレクター「トレーニング負荷を上げたのに回復指標はむしろ改善しました。体が一段階上がりましたね」（${p.o0} → ${p.o1}）`]},
grow_good:{ko:[p=>`종합 능력치 ${p.o0} → ${p.o1}. 계획대로 가고 있다는 것이 코칭스태프의 평가.`,p=>`분석팀: 주요 지표 대부분이 우상향. (${p.o0} → ${p.o1})`],
 ja:[p=>`総合値${p.o0} → ${p.o1}。計画通りに進んでいるというのがコーチ陣の評価。`,p=>`分析チーム：主要指標のほとんどが右肩上がり。（${p.o0} → ${p.o1}）`]},
grow_flat:{ko:[p=>`종합 능력치 ${p.o0} → ${p.o1}. 큰 변화 없는 정체 구간.`,p=>`코칭스태프: “숫자는 그대로지만 정체도 성장의 일부입니다.” (${p.o0} → ${p.o1})`],
 ja:[p=>`総合値${p.o0} → ${p.o1}。目立った変化のない停滞期。`,p=>`コーチ陣「数字は変わらないが、停滞も成長の一部です」（${p.o0} → ${p.o1}）`]},
grow_d_bench:{ko:[p=>`출전 시간 부족으로 경기 감각이 떨어졌다. 종합 능력치 ${p.o0} → ${p.o1}.`],ja:[p=>`出場時間不足で試合勘が鈍った。総合値${p.o0} → ${p.o1}。`]},
grow_d_inj:{ko:[p=>`부상 공백이 그대로 수치에 찍혔다. 종합 능력치 ${p.o0} → ${p.o1}.`],ja:[p=>`負傷離脱がそのまま数字に表れた。総合値${p.o0} → ${p.o1}。`]},
grow_d_age:{ko:[p=>`회복 속도가 예전 같지 않다. 반복 스프린트 능력부터 떨어지기 시작했다. 종합 능력치 ${p.o0} → ${p.o1}.`],ja:[p=>`回復のスピードが以前とは違う。反復スプリント能力から落ち始めた。総合値${p.o0} → ${p.o1}。`]},
grow_d_luck:{ko:[p=>`빅클럽의 높은 훈련 강도를 몸이 버티지 못했다. 피로 누적 지표 경고. 종합 능력치 ${p.o0} → ${p.o1}.`],ja:[p=>`ビッグクラブの高い練習強度に体が耐えきれなかった。疲労蓄積の指標に警告。総合値${p.o0} → ${p.o1}。`]},
grow_d:{ko:[p=>`컨디션 난조. 기술 지표가 전반적으로 하락했다. 종합 능력치 ${p.o0} → ${p.o1}.`],ja:[p=>`コンディション不良。技術指標が全体的に低下。総合値${p.o0} → ${p.o1}。`]},
note_PAC:{ko:[p=>`스프린트 최고 속도 ${p.kmh}km/h. 구단 GPS 데이터상 팀 내 ${p.rk}위.`],ja:[p=>`スプリント最高速度${p.kmh}km/h。クラブのGPSデータでチーム${p.rk}位。`]},
note_SHO:{ko:[p=>`슈팅 훈련 세션 유효슈팅 비율 ${p.v}%. 약발 슈팅 비중도 늘었다.`],ja:[p=>`シュート練習での枠内率${p.v}%。逆足でのシュートも増えた。`]},
note_PAS:{ko:[p=>`전진 패스 비율이 ${p.v}%까지 올라왔다. 압박 속 원터치 패스 실수가 줄었다.`],ja:[p=>`前方へのパス比率が${p.v}%まで上昇。プレス下でのワンタッチのミスが減った。`]},
note_DRI:{ko:[p=>`1대1 돌파 성공률 ${p.v}%. 첫 터치 이후 방향 전환이 빨라졌다.`],ja:[p=>`1対1の突破成功率${p.v}%。ファーストタッチ後の方向転換が速くなった。`]},
note_DEF:{ko:[p=>`수비 경합 승률 ${p.v}%. 커버 위치 선정이 한 발 빨라졌다.`],ja:[p=>`守備時のデュエル勝率${p.v}%。カバーのポジショニングが一歩早くなった。`]},
note_PHY:{ko:[p=>`Yo-Yo 테스트 레벨 ${p.v}. 경기 후반 15분 고강도 러닝 거리가 늘었다.`],ja:[p=>`Yo-Yoテストのレベル${p.v}。試合終盤15分の高強度ランニング距離が伸びた。`]},
ev_join:{ko:[p=>`${p.club} ${p.abroad?'아카데미 유학':'유스 아카데미'} 입단. ${p.age}세, 등번호 ${p.num}. 숙소 창문 너머로 1군 훈련장이 보인다.`],ja:[p=>`${p.club}${p.abroad?'のアカデミーへ留学':'のユースアカデミーに入団'}。${p.age}歳、背番号${p.num}。寮の窓からトップチームの練習場が見える。`]},
ev_debut:{ko:[p=>`1군 데뷔 — ${p.date} ${p.opp}전, ${p.min}분 출전.`],ja:[p=>`トップデビュー — ${p.date}の${p.opp}戦、${p.min}分出場。`]},
ev_firstgoal:{ko:[p=>`프로 첫 골 — ${p.date} ${p.opp}전 ${p.m}분.`],ja:[p=>`プロ初ゴール — ${p.date}の${p.opp}戦、${p.m}分。`]},
ev_pro:{ko:[p=>`프로 계약 체결. ${J(p.club,'과','와')} ${p.years}년 계약, 주급 ${p.w}.`],ja:[p=>`${p.club}とプロ契約を締結。${p.years}年契約、週給${p.w}。`]},
ev_raise:{ko:[p=>`연봉 재협상 — 주급 ${p.o} → ${p.n}.`],ja:[p=>`年俸の再交渉 — 週給${p.o} → ${p.n}。`]},
ev_prime:{ko:[()=>`만 26세, 전성기 진입. 경기 이해도와 몸이 정점에서 맞물리는 시기다. (성장 한계치 상승)`],ja:[()=>`26歳、全盛期へ。試合理解と肉体が頂点で噛み合う時期だ。（成長の上限が上昇）`]},
ev_vet:{ko:[()=>`만 31세. 회복 속도가 조금씩 느려진다. 이제부터 언제든 은퇴를 선택할 수 있다.`],ja:[()=>`31歳。回復のスピードが少しずつ落ちてきた。ここからはいつでも引退を選べる。`]},
ev_transfer:{ko:[p=>`${p.from} → ${p.to} 완전 이적 확정. 이적료 ${p.fee}, ${p.years}년 계약, 주급 ${p.w}.`],ja:[p=>`${p.from}から${p.to}への完全移籍が決定。移籍金${p.fee}、${p.years}年契約、週給${p.w}。`]},
ev_loan:{ko:[p=>`${JRo(p.to)} 시즌 종료까지 임대 이적. 원소속 ${p.from}.`],ja:[p=>`${p.to}へシーズン終了までのレンタル移籍。保有元は${p.from}。`]},
ev_loanBack:{ko:[p=>`임대 종료, ${JRo(p.club)} 복귀.`],ja:[p=>`レンタル終了、${p.club}に復帰。`]},
ev_stay:{ko:[()=>`이적시장에서 잔류를 선택했다. 구단 내 신뢰는 시간이 쌓아준다.`],ja:[()=>`移籍市場では残留を選んだ。クラブ内の信頼は時間が積み上げてくれる。`]},
ev_contAdv:{ko:[p=>`${p.cont} 조별리그 통과 (승점 ${p.pts}).`],ja:[p=>`${p.cont}グループステージ突破（勝点${p.pts}）。`]},
ev_contOut:{ko:[p=>`${p.cont} 조별리그 탈락 (승점 ${p.pts}).`],ja:[p=>`${p.cont}グループステージ敗退（勝点${p.pts}）。`]},
ev_koAdv:{ko:[p=>`${p.cont} ${p.st} 통과 — ${p.opp} 상대 합계 ${p.s}.`],ja:[p=>`${p.cont}${p.st}突破 — ${p.opp}に合計${p.s}。`]},
ev_koOut:{ko:[p=>`${p.cont} ${p.st} 탈락 — ${p.opp} 상대 합계 ${p.s}.`],ja:[p=>`${p.cont}${p.st}で敗退 — ${p.opp}に合計${p.s}。`]},
ev_cupOut:{ko:[p=>`${p.cup} ${p.st} 탈락 (상대 ${p.opp}).`],ja:[p=>`${p.cup}${p.st}で敗退（相手は${p.opp}）。`]},

/* ================= state ================= */
let S=null;
const UI={screen:'title',lang:'ko',tab:'report',confirm:null,acad:null,
 draft:{name:'',age:16,nation:'KOR',pos:'ST',form:'4-3-3',foot:'R',num:10}};
const SAVE='fbcareer.v1',LANGK='fbcareer.lang';
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE)}catch(e){}}

const t=k=>(U[UI.lang][k]!==undefined?U[UI.lang][k]:U.ko[k]);
const tr=o=>o?(o[UI.lang]!==undefined?o[UI.lang]:o.ko):'';
const ovrOf=(a,pos)=>{let s=0;for(const k of ATTR)s+=a[k]*W[pos][k];return s};
const ovr=()=>Math.round(ovrOf(S.player.attrs,S.player.pos));
const str=id=>48+C(id).rep*.42+((S&&S.cf&&S.cf[id])||0);
const ystr=id=>38+C(id).rep*.22;
const lgName=lg=>tr(LGS[lg]);
const cupName=lg=>tr(LGS[lg].cup);
const contName=lg=>tr(REGION[LGS[lg].reg]);
function avgStr(lg){const ids=LGC[lg];return ids.reduce((s,id)=>s+str(id),0)/ids.length}
function qYear(q,season){return q<=2?season:season+1}
const dstr=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const dms=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
function dlab(s,long){const [,m,d]=s.split('-').map(Number);if(UI.lang==='ja')return `${m}月${d}日`;return long?`${m}월 ${d}일`:`${m}월 ${d}일`}
const seasonLab=y=>`${y}/${String((y+1)%100).padStart(2,'0')}`;
function weeklyWage(c,o,status){if(status==='academy')return Math.round(80+c.rep*4);return Math.max(500,Math.round(25*Math.exp(c.rep*.085)*Math.exp((o-70)*.06)/50)*50)}
function marketValue(){const P=S.player,o=ovr(),a=P.age;const af=a<=21?1.6:a<=24?1.35:a<=27?1.1:a<=29?.85:a<=31?.6:a<=33?.35:.18;return Math.round(1e6*Math.exp((o-70)*.2)*af*(1+P.fame/200)/1e4)*1e4}
const followers=f=>Math.round(500*Math.exp(f*.115));
const fameTier=f=>t('fameT')[f<15?0:f<30?1:f<50?2:f<70?3:f<85?4:5];
function scoutGrade(){const P=S.player;const g=P.pot+P.scoutErr;return g>=92?'S':g>=88?'A+':g>=84?'A':g>=80?'B+':g>=76?'B':g>=72?'C+':'C'}

function startProb(id,extra,trustOverride){
 const P=S.player,o=ovr(),c=C(id);const F=FORMS[c.form];
 const slots=F[P.pos];let fit=slots>0?(slots-1)*.35:(ALT[P.pos].some(x=>F[x]>0)?-.7:-1.6);
 if(P.form===c.form)fit+=.3;
 const trust=trustOverride!==undefined?trustOverride:Math.min(S.qAtClub,12)*.12;
 return sig((o-str(id)+1.5)/2.4+fit+trust+(extra||0));
}
const roleOf=p=>p>.72?'starter':p>.42?'rotation':p>.15?'backup':'fringe';

function initAttrs(pos,age){
 const target=({15:44,16:48,17:52,18:56})[age]+randi(-2,2);
 const a={};for(const k of ATTR)a[k]=target+PROF[pos][k]+gauss()*2;
 const shift=target-ovrOf(a,pos);for(const k of ATTR)a[k]=clamp(a[k]+shift,25,99);
 return a;
}

/* ===== competitions ===== */
function rollCF(){S.cf={};for(const c of CLUBS)S.cf[c.id]=Math.round(gauss()*1.6*10)/10}
function computeContSet(se){
 const set=new Set();
 for(const lg in LGS){const ids=LGC[lg];if(LGS[lg].reg==='EU')ids.filter(id=>C(id).rep>=78).forEach(id=>set.add(id));else ids.slice().sort((a,b)=>C(b).rep-C(a).rep).slice(0,2).forEach(id=>set.add(id));}
 if(se&&se.order){const N=LGS[se.lg].reg==='EU'?4:2;LGC[se.lg].forEach(id=>set.delete(id));se.order.slice(0,N).forEach(id=>set.add(id));}
 return [...set];
}
const isCont=id=>S.contSet.includes(id);
function regionPool(id){const c=C(id),reg=LGS[c.lg].reg;return CLUBS.filter(x=>x.id!==id&&LGS[x.lg].reg===reg&&x.lg!==c.lg)}
function pickGroup(id){const pool=regionPool(id).sort((a,b)=>((isCont(b.id)?100:0)+b.rep)-((isCont(a.id)?100:0)+a.rep)).slice(0,10);const s=shuffle(pool);const out=[];const lgs=new Set();for(const x of s){if(out.length>=3)break;if(LGS[C(id).lg].reg==='EU'&&lgs.has(x.lg))continue;out.push(x.id);lgs.add(x.lg)}while(out.length<3)out.push(s[out.length].id);return out}
function initCont(id,mid){if(!isCont(id))return {alive:false};return {alive:mid?rnd()<.55:true,grp:pickGroup(id),pts:0,gp:0,opp:null,agg:[0,0],fh:true,won:false}}
function pickContOpp(st){const k=st.startsWith('R16')?.04:st.startsWith('QF')?.07:st.startsWith('SF')?.1:.13;const pool=CLUBS.filter(x=>x.id!==S.club&&LGS[x.lg].reg===LGS[C(S.club).lg].reg&&(isCont(x.id))&&!(S.cont.grp||[]).includes(x.id));return wpick(pool.length?pool:regionPool(S.club),x=>Math.exp((x.rep-75)*k)).id}
function pickCupOpp(st){const ids=LGC[C(S.club).lg].filter(x=>x!==S.club);return wpick(ids,x=>{const r=C(x).rep;return st==='R32'?(C(x).fill?2:.6):st==='F'||st==='SF'?Math.exp((r-60)*.06):1})}

function ensureTable(){
 const c=C(S.club);if(S.table&&S.table.lg===c.lg&&S.table.season===S.season)return;

function genOffers(kind){
 const P=S.player,o=ovr(),cur=C(S.club);S.offers=[];S.window=kind;
 if(S.status==='academy'&&P.age<17)return;
 const perf=S.lastRating||6.6;
 const attract=o+P.fame*.1+(P.age<=21?3:P.age>=32?-4:0)+(perf-6.8)*5;
 const cands=CLUBS.filter(c=>c.id!==S.club&&c.id!==S.parent);
 let n=Math.min(3,poisson(.7+Math.max(0,perf-6.6)*1.6+P.fame/70+(kind==='summer'?.4:0)));
 if(P.age>=34)n=Math.min(n,1);
 if(S.status==='academy'&&o<str(S.club)-6)n=Math.min(n,1);
 const chosen=[];
 for(let i=0;i<n;i++){const pool=cands.filter(x=>!chosen.includes(x));const c=wpick(pool,x=>{const dd=str(x.id)-(attract+1.5);return Math.exp(-dd*dd/32)*(x.rep>cur.rep?1.3:.8)*(x.lg===P.nation?1.2:1)});chosen.push(c)}
 chosen.forEach(c=>S.offers.push(makeOffer(c,'transfer')));
 if(S.status==='pro'&&!S.parent&&P.age<=23&&(S.lastShare??0)<.35&&str(S.club)-o>=2){
  const pool=cands.filter(x=>!chosen.includes(x));const lc=wpick(pool,x=>{const dd=str(x.id)-(o-1);return Math.exp(-dd*dd/18)*(x.rep<cur.rep?1.2:.5)});
  S.offers.push(makeOffer(lc,'loan'))}
}
function makeOffer(c,type){
 const P=S.player,o=ovr(),v=marketValue();
 const fee=type==='loan'?Math.round(v*rand(.03,.08)/1e4)*1e4:Math.round(v*rand(.85,1.35)/1e4)*1e4;
 const wage=type==='loan'?S.wage:Math.round(weeklyWage(c,o,'pro')*rand(.95,1.2)/50)*50;
 const p=startProb(c.id,0,0);
 const years=type==='loan'?0:P.age<24?randi(4,5):P.age<30?randi(3,4):randi(1,2);
 return {id:c.id,type,fee,wage,years,role:roleOf(p),p,from:S.club};
}

 if(of.type==='loan'){S.parentQ=S.qAtClub;S.parent=S.club;S.club=of.id;S.pending.push({k:'ev_loan',p:{to:of.id,from:prev}})}
 else{S.parent=null;S.club=of.id;S.wage=of.wage;S.contractEnd=S.season+of.years;S.status='pro';const bonus=Math.round(of.fee*.03);P.money+=bonus;S.pending.push({k:'ev_transfer',p:{to:of.id,from:prev,fee:of.fee,years:of.years,w:of.wage,bonus}})}
 if(C(of.id).lg!==prevLg&&C(of.id).lg!==P.nation)P.adapt=Math.max(P.adapt,1);

function careerTotals(){const P=S.player;let rs=0,rn=0;for(const s of S.seasons)for(const c of s.clubs){rs+=c.rs;rn+=c.rn}for(const k in S.cs.st){rs+=S.cs.st[k].rs;rn+=S.cs.st[k].rn}return {apps:P.carApps,g:P.carG,a:P.carA,r:rn?(rs/rn).toFixed(2):'–'}}

function finishCareer(type){
 const P=S.player,o=ovr();

function act(a,el){
 const v=el?el.dataset.v:undefined;
 switch(a){
  case 'lang':UI.lang=v;try{localStorage.setItem(LANGK,v)}catch(e){}break;
  case 'toCreate':UI.screen='create';UI.confirm=null;break;
  case 'toTitle':UI.screen='title';break;
  case 'continue':UI.screen=S.ended?'end':'game';UI.tab=S.reports.length?'report':'plan';break;
  case 'randName':UI.draft.name=defaultName(UI.draft.nation);break;
  case 'set':{const k=el.dataset.k;UI.draft[k]=(k==='age')?parseInt(v):v;break}
  case 'toAcad':UI.acad=academyOptions(UI.draft);UI.screen='academy';break;
  case 'pickAcad':newGame(UI.acad[parseInt(v)]);UI.screen='game';UI.tab='report';save();break;
  case 'tab':UI.tab=v;UI.confirm=null;window.scrollTo({top:0});break;
  case 'plan':{const k=el.dataset.k;if(k==='train')S.plan.train=parseInt(v);else if(k==='focus')S.plan.focus=v;else if(k==='biz'){S.plan.biz=v||null;S.plan.bizX=1}else if(k==='bizX')S.plan.bizX=parseInt(v);else if(k==='ext')S.plan.ext=v||null;save();break}
  case 'accept':acceptOffer(parseInt(v));save();break;
  case 'decline':declineOffers();save();break;

  case 'askRetire':UI.confirm='retire';break;
  case 'retire':finishCareer(v==='forced'?'forced':'vol');UI.screen='end';UI.confirm=null;save();window.scrollTo({top:0});break;
  case 'askNew':UI.confirm='new';break;
  case 'cancel':UI.confirm=null;break;
  case 'doNew':clearSave();S=null;UI.confirm=null;UI.screen='create';UI.draft.name='';window.scrollTo({top:0});break;
 }
 render();
}
