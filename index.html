<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>축구선수 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Black+Han+Sans&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: sticky registration card (club-coloured header) left, tabbed matchday dossier right; one column on phones.
   Overlays: monthly results ticker, penalty mini-games, trophy ceremony. */
:root{
  --bg:#e6ebe4; --surface:#f7f9f5; --sunk:#dbe3d9; --ink:#13241a; --muted:#56685b; --line:#c3cfc3;
  --pitch:#1d5838; --pitch2:#246742; --chalk:#f1f6ef; --accent:#e0ad08; --accent-ink:#1b1500;
  --up:#16794a; --down:#bd3628; --warn:#9a6a00; --draw:#6b7a70;
  --b1:#9b4a3f; --b2:#b8661d; --b3:#a48a12; --b4:#2f8a4a; --b5:#16799a; --b6:#7a3fb0;
  --z1:#1d63b8; --z2:#d07d10; --z3:#bd3628; --z4:#16794a;
  --shadow:0 18px 50px rgba(10,30,18,.28);
  --disp:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --num:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
:root:lang(ja){--disp:'Dela Gothic One','IBM Plex Sans JP',sans-serif;--body:'IBM Plex Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1611; --surface:#132019; --sunk:#1b2b22; --ink:#e3ece5; --muted:#93a698; --line:#27392d;
  --pitch:#1a4d32; --pitch2:#1f5838; --chalk:#eef5ee; --accent:#f0c33f; --accent-ink:#1b1500;
  --up:#4cc07e; --down:#ef6c5c; --warn:#e0b04a; --draw:#8d9d92;
  --b1:#d8786a; --b2:#e39446; --b3:#d9c04a; --b4:#5fca7e; --b5:#4cc0e0; --b6:#b48aea;
  --z1:#5c9ef0; --z2:#efa346; --z3:#ef6c5c; --z4:#4cc07e; --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1611; --surface:#132019; --sunk:#1b2b22; --ink:#e3ece5; --muted:#93a698; --line:#27392d;
  --pitch:#1a4d32; --pitch2:#1f5838; --chalk:#eef5ee; --accent:#f0c33f; --accent-ink:#1b1500;
  --up:#4cc07e; --down:#ef6c5c; --warn:#e0b04a; --draw:#8d9d92;
  --b1:#d8786a; --b2:#e39446; --b3:#d9c04a; --b4:#5fca7e; --b5:#4cc0e0; --b6:#b48aea;
  --z1:#5c9ef0; --z2:#efa346; --z3:#ef6c5c; --z4:#4cc07e; --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .up{color:var(--up)} .down{color:var(--down)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pitch);color:var(--chalk);display:flex;align-items:center;gap:12px;padding-block:9px;padding-inline:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-size:18px;background:none;border:0;color:inherit;padding:0}
.brand svg{width:30px;height:30px;flex:none}
.datechip{font-family:var(--num);font-size:17px;font-weight:600;letter-spacing:.04em}
.top .sp{flex:1}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--chalk) 35%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 11px;font-size:13px;color:var(--chalk)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--pitch)}
.ghost{background:none;border:1px solid color-mix(in srgb,var(--chalk) 35%,transparent);color:var(--chalk);border-radius:999px;padding:3px 12px;font-size:13px}
.banner{background:var(--accent);color:var(--accent-ink);padding-block:10px;padding-inline:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner button{border:1px solid var(--accent-ink);background:none;border-radius:6px;padding:4px 12px;color:var(--accent-ink)}
.banner button.solid{background:var(--accent-ink);color:var(--accent)}
.page{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:500}
.btn.pri{background:var(--pitch);color:var(--chalk);border-color:var(--pitch)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.warn{border-color:var(--down);color:var(--down)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--pitch);background:var(--pitch);color:var(--chalk)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip .code{font-family:var(--num);font-weight:700;letter-spacing:.06em;font-size:13px;opacity:.75}
.tagx{display:inline-block;font-size:11px;letter-spacing:.05em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tagx.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tagx.red{border-color:var(--down);color:var(--down)}
.tagx.grn{border-color:var(--up);color:var(--up)}
/* title */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:24px}
.hero h1{font-size:clamp(40px,8vw,78px);line-height:1.05}
.hero .tag{font-size:17px;color:var(--muted);max-width:36em;margin-top:14px}
.hero .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hero canvas{width:100%;aspect-ratio:4/3;border-radius:10px;display:block;box-shadow:var(--shadow)}
.saveinfo{font-size:13px;color:var(--muted);margin-top:10px}
.hof{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:10px}
.hofc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:grid;gap:6px}
.hofc b{font-family:var(--disp);font-weight:400;font-size:18px}
/* create */
.form{display:grid;gap:22px;max-width:920px}
.fld>label,.fld>.lbl{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:500}
.fld .hint{font-size:13px;color:var(--muted);margin-top:6px}
.inp{width:100%;max-width:360px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.nat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.nat .chip{justify-content:flex-start}
.nat .eu{margin-left:auto;font-size:10px;font-family:var(--num);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:3px}
.posgrid{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:18px;align-items:start}
.pp{position:relative;aspect-ratio:68/88;width:100%;max-width:240px;border-radius:6px;background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch2) 10% 20%)}
.pp::before{content:"";position:absolute;inset:5%;border:2px solid color-mix(in srgb,var(--chalk) 70%,transparent);border-bottom:0}
.pp .box{position:absolute;left:25%;right:25%;top:5%;height:15%;border:2px solid color-mix(in srgb,var(--chalk) 70%,transparent);border-top:0}
.pp .gbox{position:absolute;left:36%;right:36%;bottom:0;height:9%;border:2px solid color-mix(in srgb,var(--chalk) 70%,transparent);border-bottom:0}
.pp button{position:absolute;transform:translate(-50%,-50%);border-radius:999px;border:2px solid var(--chalk);background:color-mix(in srgb,var(--pitch) 70%,#000);color:var(--chalk);font-family:var(--num);font-weight:700;font-size:14px;letter-spacing:.05em;padding:3px 9px}
.pp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.posdesc b{font-family:var(--disp);font-weight:400;font-size:20px;display:block;margin-bottom:4px}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px}
.fcard{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;display:grid;gap:6px}
.fcard[aria-pressed="true"]{border-color:var(--pitch);box-shadow:inset 0 0 0 1px var(--pitch)}
.fcard .fn{font-family:var(--num);font-weight:700;font-size:20px}
.fcard svg{width:100%;height:auto;color:var(--pitch)}
.fcard .fs{font-size:12px;color:var(--muted);line-height:1.4}
.body{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.body input[type=range]{width:180px;accent-color:var(--pitch)}
.traitbox{margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 6px 6px 0;font-size:14px;max-width:70ch}
/* academy */
.acad{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;align-content:start}
.acard .hd,.ocard .hd{display:flex;gap:12px;align-items:center}
.acard .cn,.ocard .cn{font-family:var(--num);font-weight:700;font-size:21px;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.stars{color:var(--warn);letter-spacing:.08em}
/* game */
.game{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
.pcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:calc(100vh - 80px);overflow-y:auto}
.pc-top{padding:14px 16px 16px;position:relative}
.pc-club{display:flex;align-items:center;gap:10px;font-size:12.5px}
.pc-club b{font-family:var(--num);font-size:17px;font-weight:700;display:block;line-height:1.1}
.pc-main{display:flex;align-items:flex-end;gap:12px;margin-top:12px}
.kit{font-family:var(--num);font-weight:700;font-size:62px;line-height:.85}
.pc-name{font-family:var(--disp);font-size:20px;line-height:1.2}
.pc-sub{font-size:12.5px;display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.pill{display:inline-block;font-size:11px;letter-spacing:.04em;border-radius:4px;padding:1px 6px;background:rgba(0,0,0,.18)}
.pill.y{background:var(--accent);color:var(--accent-ink)}
.pc-ovr{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pc-ovr .big{font-family:var(--num);font-weight:700;font-size:54px;line-height:1}
.pc-ovr .big sup{font-size:24px;color:var(--warn);margin-left:1px}
.pc-ovr .lab{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.pc-ovr .side{display:grid;gap:2px;margin-left:auto;text-align:right;font-size:12.5px}
.agrp{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;gap:5px}
.agrp h4{margin:0;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;text-transform:uppercase}
.attr{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.v{font-family:var(--num);font-weight:700;font-size:16px;text-align:right}
.c1{color:var(--b1)} .c2{color:var(--b2)} .c3{color:var(--b3)} .c4{color:var(--b4)} .c5{color:var(--b5)} .c6{color:var(--b6)}
.f1{background:var(--b1)} .f2{background:var(--b2)} .f3{background:var(--b3)} .f4{background:var(--b4)} .f5{background:var(--b5)} .f6{background:var(--b6)}
.meters{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:12.5px}
.meter span{display:flex;justify-content:space-between}
.meter .bar{height:5px;margin-top:3px}
.econ{padding:12px 16px;display:grid;gap:7px;font-size:13px}
.econ .r{display:flex;justify-content:space-between;gap:8px}
.econ .r b{font-family:var(--num);font-size:16px;font-weight:600}
.fame{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fame i{display:block;height:100%;background:var(--accent)}
.injbox{margin:0 16px 14px;padding:8px 10px;border-radius:6px;background:color-mix(in srgb,var(--down) 12%,var(--surface));color:var(--down);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--down);margin-left:6px;vertical-align:middle}
/* report */
.rep{display:grid;gap:22px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.headline{font-size:clamp(22px,3.2vw,31px);margin-top:6px}
.byline{font-size:13px;color:var(--muted);margin-top:6px;font-style:italic}
.photo{position:relative;border-radius:10px;overflow:hidden;background:#0b1410;box-shadow:var(--shadow)}
.photo canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;color:#fff;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.photo figcaption b{display:block;font-family:var(--disp);font-weight:400;font-size:17px}
figure{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.kpi{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kpi .k{font-size:11px;letter-spacing:.05em;color:var(--muted)}
.kpi .v2{font-family:var(--num);font-weight:700;font-size:26px;line-height:1.1}
.kpi .v2 small{font-size:14px;font-weight:500;color:var(--muted)}
.wdl{display:inline-flex;gap:6px;font-family:var(--num);font-weight:700;font-size:20px}
.wdl .W{color:var(--up)} .wdl .D{color:var(--draw)} .wdl .L{color:var(--down)}
.sec{display:grid;gap:10px;min-width:0}
.sec>h3{font-size:16px;display:flex;align-items:center;gap:10px}
.sec>h3::after{content:"";flex:1;border-top:1px solid var(--line)}
.prose{max-width:70ch;display:grid;gap:8px}
.news{display:grid;gap:6px}
.news div{padding:8px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 6px 6px 0;font-size:14px}
.news div.tr{border-left-color:var(--up);font-weight:600}
.quote{font-size:15px;max-width:70ch;padding:12px 16px;background:var(--surface);border-radius:8px;border:1px solid var(--line)}
.quote .who{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.keym{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;max-width:78ch}
.keym .mh{font-family:var(--num);font-weight:600;font-size:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.keym .sc{font-size:22px;font-weight:700}
.keym ul{margin:0;padding-left:18px;display:grid;gap:3px}
.keym .stl{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--num);font-size:15px;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.dim td{color:var(--muted)}
tr.me td{background:color-mix(in srgb,var(--accent) 18%,var(--surface));font-weight:600}
td.zone{width:4px;padding:0}
td.z1{background:var(--z1)} td.z2{background:var(--z2)} td.z3{background:var(--z3)} td.z4{background:var(--z4)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.comp{font-family:var(--num);font-weight:600;font-size:13px;letter-spacing:.03em}
.res{display:inline-block;min-width:20px;text-align:center;border-radius:3px;font-family:var(--num);font-weight:700;font-size:12px;color:#fff;margin-right:6px;padding:0 3px}
.res.W{background:var(--up)} .res.D{background:var(--draw)} .res.L{background:var(--down)}
.rt{display:inline-block;min-width:36px;text-align:center;border-radius:4px;padding:0 4px;font-family:var(--num);font-weight:700;font-size:14px}
.rt.r9{background:var(--b5);color:#fff}
.rt.r8{background:var(--up);color:#fff}
.rt.r7{background:color-mix(in srgb,var(--up) 22%,var(--surface));color:var(--up)}
.rt.r6{background:var(--sunk);color:var(--ink)}
.rt.r5{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--warn)}
.rt.r4{background:color-mix(in srgb,var(--down) 20%,var(--surface));color:var(--down)}
.money td:last-child{text-align:right;font-family:var(--num);font-size:15px}
.money tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.offlist{display:grid;gap:8px}
.offlist div{font-size:14px;padding-left:12px;border-left:2px solid var(--line)}
.se{background:var(--surface);border:2px solid var(--pitch);border-radius:12px;padding:16px;display:grid;gap:12px}
.trow{display:flex;gap:8px;flex-wrap:wrap}
.trophy{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700}
.trophy svg{width:14px;height:14px}
.award{display:inline-flex;border:1px solid var(--pitch);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:500}
.empty{padding:28px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.hint2{font-size:13px;color:var(--muted);padding:10px 12px;background:var(--sunk);border-radius:8px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.info .lock{color:var(--muted);font-size:13px}
/* sns */
.feed{display:grid;gap:10px;max-width:640px}
.post{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:700;color:#fff;font-size:15px}
.post .hd{font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.post .hd b{font-size:14px}
.post .hd span{color:var(--muted)}
.post .tx{font-size:14.5px;margin-top:2px;overflow-wrap:anywhere}
.post .ft{display:flex;gap:16px;color:var(--muted);font-size:12px;margin-top:6px;font-family:var(--num);letter-spacing:.02em}
.post.own{border-color:var(--accent)}
.post.club{border-color:var(--pitch)}
/* plan */
.plan{display:grid;gap:24px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;display:grid;gap:3px;align-content:start}
.opt[aria-pressed="true"]{border-color:var(--pitch);box-shadow:inset 0 0 0 1.5px var(--pitch)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .on{font-weight:700;font-size:14px}
.opt .od{font-size:12.5px;color:var(--muted);line-height:1.45}
.opt .oc{font-family:var(--num);font-weight:600;font-size:15px}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.ocard.gone{opacity:.55}
.ocard .q{font-size:13.5px;line-height:1.5}
.ocard .ag{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.nego{display:flex;gap:6px;flex-wrap:wrap}
.window{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:16px;display:grid;gap:14px}
.evcard{background:var(--surface);border:2px solid var(--pitch);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.evcard.done{border-color:var(--line)}
.evcard .res2{font-size:14px;padding:8px 10px;background:var(--sunk);border-radius:8px}
.delta{display:flex;gap:6px;flex-wrap:wrap}
.planfoot{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:5}
.planfoot .sum{font-size:13px;color:var(--muted);flex:1;min-width:200px}
.planfoot .sum b{color:var(--ink);font-family:var(--num);font-size:16px}
.holdings{font-size:13px;display:grid;gap:4px}
.retire{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
/* gallery & end */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.endhero{border-radius:14px;padding:26px 22px;display:grid;gap:10px;color:#fff}
.endhero .gr{display:inline-block;background:var(--accent);color:var(--accent-ink);font-family:var(--disp);padding:4px 12px;border-radius:6px;font-size:18px;justify-self:start}
.endhero h1{font-size:clamp(30px,6vw,54px)}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details>summary{cursor:pointer;padding:10px 14px;font-weight:500}
details>.in{padding:6px 14px 16px;display:grid;gap:16px}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,14,9,.66);display:grid;place-items:center;padding:16px;overflow-y:auto}
.mod{width:min(720px,100%);background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:grid}
.mod .mh2{background:var(--pitch);color:var(--chalk);padding:12px 16px;display:flex;gap:10px;align-items:center}
.mod .mh2 h3{font-size:18px;flex:1}
.mod .mb{padding:14px 16px;display:grid;gap:10px;max-height:min(70vh,640px);overflow-y:auto}
.mod .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tk{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--bg);animation:tkin .28s ease-out both}
.tk .d{font-family:var(--num);font-size:14px;color:var(--muted)}
.tk .o{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .o small{display:block;color:var(--muted);font-size:12px}
.tk .s{font-family:var(--num);font-weight:700;font-size:22px;text-align:right;display:flex;align-items:center;gap:8px}
@keyframes tkin{from{transform:translateY(8px);opacity:.2}to{transform:none;opacity:1}}
.mini canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;border-radius:8px;cursor:crosshair;touch-action:none;background:#14331f}
.mini .msg{font-family:var(--disp);font-size:20px;text-align:center;min-height:30px}
.mini .tm{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.mini .tm i{display:block;height:100%;background:var(--down);width:100%}
.dots{display:grid;gap:4px;font-size:13px}
.dots div{display:flex;gap:6px;align-items:center}
.dots i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.dots i.g{background:var(--up);border-color:var(--up)} .dots i.x{background:var(--down);border-color:var(--down)}
.cer{position:relative}
.cer canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
.cer .cap{padding:14px 16px;display:grid;gap:4px;text-align:center}
.cer .cap b{font-family:var(--disp);font-weight:400;font-size:24px}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}.pcard{position:static;max-height:none}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.posgrid{grid-template-columns:minmax(0,1fr)}.kpi .v2{font-size:22px}.tk{grid-template-columns:48px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}}

 {id:'party',w:2,c:()=>S.status==='pro'&&age()>=18,
  t:[p=>L(`고참 ${p.mate}가 경기 전날 밤 시내 라운지 파티에 초대했다. “다들 와. 너도 와.”`,`ベテランの${p.mate}が試合前夜の街のラウンジパーティーに誘ってきた。「みんな来る。お前も来いよ」`)],
  ch:[{l:['간다','行く'],fx:()=>{if(R()<.22){D({tea:5,cond:-10,fame:-3,tru:-7});return 1}D({tea:6,cond:-10});return 0},r:[()=>L('새벽 2시에 숙소에 들어왔다. 동료들과는 확실히 가까워졌다.','午前2時に帰宅。チームメイトとは確実に距離が縮まった。'),()=>L('누군가 찍은 사진이 SNS에 퍼졌다. 경기 전날 밤이라는 사실에 감독이 격노했다.','誰かが撮った写真がSNSで拡散。試合前夜だったことに監督が激怒した。')]},
   {l:['정중히 거절한다','丁重に断る'],fx:()=>{D({cond:5,tea:-3});return 0},r:[()=>L('일찍 잠들었다. 다음 날 몇몇이 “재미없는 녀석”이라고 놀렸다.','早めに寝た。翌日、何人かに「つまらないやつ」とからかわれた。')]},
   {l:['얼굴만 비추고 일찍 나온다','顔だけ出して早めに帰る'],fx:()=>{D({tea:3,cond:-3});return 0},r:[()=>L('한 시간만 있다가 빠져나왔다. 적당한 선을 지켰다.','1時間だけいて抜け出した。ちょうどいい線を守った。')]}]},
 {id:'snsfight',w:2,c:()=>S.P.fame>=15,
  t:[p=>L(`한 팬 계정이 “${pnm()}은 이 팀 수준이 아니다”라는 글을 올렸고 리포스트가 3천을 넘었다.`,`あるファンアカウントが「${pnm()}はこのチームのレベルじゃない」と投稿し、リポストが3000を超えた。`),p=>L(`실수 장면만 모은 30초 영상이 조회수 80만을 찍었다. 댓글창이 뜨겁다.`,`ミスシーンだけを集めた30秒動画が再生回数80万に。コメント欄が荒れている。`)],
  ch:[{l:['무시한다','無視する'],fx:()=>{D({mor:-2});return 0},r:[()=>L('휴대폰을 엎어두었다. 그래도 신경은 쓰였다.','スマホを伏せた。それでも気にはなった。')]},
   {l:['유머로 받아친다','ユーモアで返す'],fx:()=>{if(R()<.6){D({fame:2,mor:2});return 0}D({fame:-1});return 1},r:[()=>L('“다음 경기에서 영상 추가해드릴게요 (골 장면으로)”. 팬들이 박수를 보냈다.','「次の試合で動画を追加しますね（ゴールシーンで）」。ファンは拍手を送った。'),()=>L('농담이 통하지 않았다. 오히려 기사가 하나 더 났다.','冗談が通じなかった。むしろ記事がもう一本出た。')]},
   {l:['정면으로 반박한다','正面から反論する'],fx:()=>{if(R()<.25){D({fame:1,tea:-2,tru:-4});return 1}D({fame:1.5,tea:-2});return 0},r:[()=>L('긴 글을 올렸다. 지지와 비판이 반반으로 갈렸다.','長文を投稿した。支持と批判が半々に分かれた。'),()=>L('구단 홍보팀이 SNS 사용 자제를 공식 요청했다.','クラブ広報からSNSの自粛を正式に求められた。')]}]},
 {id:'pain',w:2,c:()=>S.status==='pro'&&S.P.cond<80,
  t:[()=>L('중요한 경기를 앞두고 종아리가 당긴다. 의무팀: “진통제를 맞으면 뛸 수는 있다. 선택은 네가 해.”','大事な試合を前にふくらはぎが張っている。メディカル「痛み止めを打てば出られる。決めるのは君だ」')],
  ch:[{l:['진통제를 맞고 뛴다','痛み止めを打って出る'],fx:()=>{D({tru:6,painkiller:1});return 0},r:[()=>L('감독이 고개를 끄덕였다. 이번 달 부상 위험이 크게 높아졌다.','監督がうなずいた。今月の負傷リスクが大きく上がった。')]},
   {l:['이번엔 쉰다','今回は休む'],fx:()=>{D({tru:-4,cond:12});return 0},r:[()=>L('감독은 아쉬운 표정이었지만 몸은 확실히 가벼워졌다.','監督は残念そうだったが、体は確実に軽くなった。')]}]},
 {id:'poschange',w:1.5,c:()=>S.status==='pro'&&S.tenure>=3&&S.P.pos!=='GK'&&ALT[S.P.pos].length&&!S.flags.posAsked,
  p:()=>{const alt=ALT[S.P.pos][Math.floor(R()*ALT[S.P.pos].length)];return {alt,o1:Math.round(ovrOf(S.P.a,alt))}},
  t:[p=>L(`감독이 면담을 요청했다. “${tr(PN[p.alt])} 자리에서 뛰어보는 건 어때? 거기서 더 쓸모가 있을 것 같은데.” (예상 종합 ${p.o1})`,`監督から面談の要請。「${tr(PN[p.alt])}でプレーしてみないか？そっちの方が活きると思う」（予想総合値${p.o1}）`)],
  ch:[{l:['포지션을 바꾼다','ポジションを変える'],fx:p=>{S.flags.posAsked=1;S.P.pos=p.alt;D({tru:8,mor:-2});return 0},r:[p=>L(`이제부터 ${tr(PN[p.alt])}. 훈련 조끼 색이 바뀌었다.`,`これからは${tr(PN[p.alt])}。練習ビブスの色が変わった。`)]},
   {l:['지금 포지션을 고집한다','今のポジションにこだわる'],fx:()=>{S.flags.posAsked=1;D({tru:-5});return 0},r:[()=>L('“알겠다. 그럼 그 자리에서 증명해.”','「分かった。ならその場所で証明しろ」')]}]},
 {id:'captain',w:1.2,c:()=>S.status==='pro'&&S.tenure>=24&&age()>=25&&S.P.tru>=60&&!S.flags.captain,
  t:[()=>L('구단이 다음 시즌 주장 완장을 제안했다. 선수단 투표에서도 가장 많은 표를 받았다고 한다.','クラブが来季のキャプテンを打診してきた。選手投票でも最多票だったという。')],
  ch:[{l:['완장을 찬다','腕章を巻く'],fx:()=>{D({captain:1,fame:3,tea:5,mor:3});return 0},r:[()=>L('주장으로서 첫 미팅. 말보다 훈련장에서 먼저 보여주기로 했다.','キャプテンとして初のミーティング。言葉より練習場で示すと決めた。')]},
   {l:['정중히 고사한다','丁重に辞退する'],fx:()=>{D({tea:-1});return 0},r:[()=>L('“아직은 제 플레이에 집중하고 싶습니다.” 구단은 이해했다.','「今はまだ自分のプレーに集中したい」。クラブは理解を示した。')]}]},
 {id:'mentor',w:1.2,c:()=>S.status==='pro'&&age()>=26,
  t:[p=>L(`유스에서 올라온 18세 ${p.mate}가 개인 훈련을 같이 하고 싶다며 찾아왔다. 눈빛이 예전의 나 같다.`,`ユースから上がってきた18歳の${p.mate}が一緒に自主練をしたいと訪ねてきた。目つきが昔の自分に似ている。`)],
  ch:[{l:['매일 함께 남는다','毎日一緒に残る'],fx:()=>{D({tea:5,mor:3,cond:-3,fame:.5,attr:{VIS:.4,COM:.3}});return 0},r:[()=>L('가르치면서 오히려 배웠다. 내 플레이를 말로 설명하는 법을 알게 됐다.','教えることで逆に学んだ。自分のプレーを言葉で説明する方法が分かった。')]},
   {l:['가끔만 봐준다','たまに見てあげる'],fx:()=>{D({tea:2});return 0},r:[()=>L('주 1회 슈팅 훈련을 같이 했다.','週1回、シュート練習を一緒にした。')]}]},
 {id:'agentpush',w:1.5,c:()=>S.status==='pro'&&S.scout>=1&&!S.loan&&((S._lastShare||1)<.45||tovr()>cstr(S.club)+4),
  t:[()=>L('에이전트가 커피숍에서 서류 한 장을 내밀었다. “지금 이적 요청서를 내면 다음 창에서 길이 열립니다.”','代理人がカフェで書類を一枚差し出した。「今移籍志願書を出せば、次の市場で道が開けます」')],
  ch:[{l:['이적 요청서를 낸다','移籍志願書を出す'],fx:()=>{D({reqT:1,tru:-15,tea:-4,fame:-1});return 0},r:[()=>L('구단이 성명을 냈다. “선수의 뜻은 확인했다.” 홈 팬들의 시선이 차가워졌다.','クラブが声明を発表。「選手の意思は確認した」。ホームのファンの視線が冷たくなった。')]},
   {l:['아직은 보류한다','まだ保留する'],fx:()=>0,r:[()=>L('“조금 더 해보고 싶어요.” 에이전트는 서류를 다시 가방에 넣었다.','「もう少しやってみたい」。代理人は書類を鞄に戻した。')]}]},
 {id:'rumor',w:2,c:()=>S.status==='pro'&&S.P.fame>=28,
  p:()=>{const big=CLUBS.filter(c=>c.s>=cstr(S.club)+5&&c.s<=tovr()+10&&c.id!==S.club);const b=big.length?big[Math.floor(R()*big.length)]:CLUBS.find(c=>c.s>=120);return {big:b.id}},
  t:[p=>L(`${p.media}: “${J(cn(p.big),'이','가')} ${J(pnm(),'을','를')} 주시 중”. 기자회견에서 그 질문만 쏟아졌다.`,`${p.media}「${cn(p.big)}が${pnm()}を注視」。記者会見ではその質問ばかりが飛んだ。`)],
  ch:[{l:['“꿈의 클럽이다”','「夢のクラブだ」'],fx:()=>{D({fame:2,tru:-6,reqT:1});return 0},r:[()=>L('클립이 하루 종일 돌았다. 현 소속팀 팬들은 배신감을 드러냈다.','その映像が一日中出回った。現所属のファンは裏切られたと感じている。')]},
   {l:['“지금 팀에 집중한다”','「今のチームに集中する」'],fx:()=>{D({tru:4,tea:2});return 0},r:[()=>L('홈 팬들이 다음 경기에서 이름을 연호했다.','ホームのファンは次の試合で名前をコールした。')]},
   {l:['웃으며 넘긴다','笑ってはぐらかす'],fx:()=>{D({fame:.5});return 0},r:[()=>L('“기사는 기자분들이 쓰시는 거죠.” 무난하게 넘어갔다.','「記事は記者の皆さんが書くものですから」。無難に切り抜けた。')]}]},
 {id:'sponsor',w:1.5,c:()=>S.P.fame>=25,
  p:()=>({brand:['Aurum Sport Drink','Velo Chrono','Kaito Grooming','Nordlys Audio','Strada Motors','Halden Boots','Mirae Mobile'][Math.floor(R()*7)],amt:Math.round((S.P.fame-15)**2*420/1000)*1000}),
  t:[p=>L(`${p.brand}에서 개인 스폰서 제안. 연 ${fmtE(p.amt)}. 대신 시즌 중 광고 촬영 4회.`,`${p.brand}から個人スポンサーの提案。年${fmtE(p.amt)}。ただしシーズン中にCM撮影4回。`)],
  ch:[{l:['풀 패키지 계약','フルパッケージ契約'],fx:p=>{D({money:p.amt,cond:-8});return 0},r:[p=>L(`${fmtE(p.amt)} 입금. 촬영 일정 탓에 회복 시간이 줄었다.`,`${fmtE(p.amt)}が入金。撮影で回復の時間が減った。`)]},
   {l:['SNS 게시물만 계약','SNS投稿のみ契約'],fx:p=>{D({money:Math.round(p.amt*.3)});return 0},r:[p=>L(`${fmtE(Math.round(p.amt*.3))} 계약. 부담 없는 선에서 정리했다.`,`${fmtE(Math.round(p.amt*.3))}で契約。負担のない範囲でまとめた。`)]},
   {l:['거절한다','断る'],fx:()=>{D({mor:1});return 0},r:[()=>L('지금은 축구에만 집중하기로 했다.','今はサッカーだけに集中すると決めた。')]}]},
 {id:'charity',w:1.5,c:()=>S.P.fame>=10&&S.club,p:()=>({city:CL[S.club].city}),
  t:[p=>L(`${p.city}의 소아병원에서 방문 요청이 왔다. 병실에 내 유니폼을 걸어둔 아이가 있다고 한다.`,`${p.city}の小児病院から訪問の依頼。病室に自分のユニフォームを飾っている子がいるという。`)],
  ch:[{l:['직접 찾아간다','直接訪ねる'],fx:()=>{D({fame:1.5,mor:4,cond:-2});return 0},r:[()=>L('아이에게 사인 공을 건넸다. 돌아오는 차 안에서 한동안 말이 없었다.','子どもにサインボールを手渡した。帰りの車の中でしばらく言葉が出なかった。')]},
   {l:['기부만 한다','寄付だけする'],fx:()=>{D({money:-Math.max(2000,Math.round(S.contract.w*.8)),fame:.8});return 0},r:[()=>L('익명으로 하려 했지만 병원이 감사 글을 올렸다.','匿名にしたかったが、病院が感謝の投稿をした。')]},
   {l:['일정상 어렵다','日程的に難しい'],fx:()=>{D({fame:-.3});return 0},r:[()=>L('구단 홍보팀이 대신 사인 유니폼을 보냈다.','クラブ広報が代わりにサイン入りユニフォームを送った。')]}]},
 {id:'lockerbad',w:3,c:()=>S.club&&S.status!=='academy'&&S.atmo<40,
  t:[()=>L('연패가 길어지자 라커룸 공기가 무겁다. 몇몇 고참이 감독 전술에 대놓고 불만을 드러냈다.','連敗が続き、ロッカールームの空気が重い。何人かのベテランが監督の戦術に公然と不満を口にした。')],
  ch:[{l:['선수단 미팅을 주도한다','選手ミーティングを主導する'],fx:()=>{if(R()<.55){D({atmo:12,tea:6,fame:1});return 0}D({tea:-6});return 1},r:[()=>L('“지금 서로 탓할 때가 아니다.” 그날 이후 훈련 분위기가 달라졌다.','「今は責め合う時じゃない」。その日から練習の雰囲気が変わった。'),()=>L('나섰지만 “네가 뭔데”라는 반응이 돌아왔다.','前に出たが、「何様だ」という反応が返ってきた。')]},
   {l:['감독 편에 선다','監督の側に立つ'],fx:()=>{D({tru:6,tea:-5});return 0},r:[()=>L('감독은 고마워했지만 일부 동료들과는 거리가 생겼다.','監督には感謝されたが、一部のチームメイトとは距離ができた。')]},
   {l:['내 할 일만 한다','自分のことだけやる'],fx:()=>{D({mor:-2});return 0},r:[()=>L('조용히 개인 훈련을 늘렸다. 분위기는 그대로다.','黙々と自主練を増やした。雰囲気は変わらない。')]}]},
 {id:'rival',w:1.5,c:()=>S.status==='pro'&&(S._lastShare||0)>=.5&&S.club,
  p:()=>{const nats=NATLIST.filter(n=>n!==S.P.nat);const n=nats[Math.floor(R()*nats.length)];return {rn:n,rv:NAMES[n][Math.floor(R()*8)]}},
  t:[p=>L(`구단이 같은 포지션에 ${nn(p.rn)} 국가대표 ${J(p.rv,'을','를')} 영입했다. 이적료가 내 몸값의 두 배다.`,`クラブが同じポジションに${nn(p.rn)}代表の${p.rv}を獲得した。移籍金は自分の市場価値の倍だ。`)],
  ch:[{l:['훈련으로 정면 승부','練習で真っ向勝負'],fx:()=>{D({cond:-8,mor:2,attr:{[Object.keys(PW[S.P.pos])[0]]:.8}});return 0},r:[()=>L('매일 마지막까지 훈련장에 남았다. 수치가 조금 올랐지만 몸은 무겁다.','毎日最後まで練習場に残った。数値は少し上がったが体は重い。')]},
   {l:['감독과 면담한다','監督と面談する'],fx:()=>{if(R()<.5){D({tru:4});return 0}D({tru:-3});return 1},r:[()=>L('“경쟁은 공정하다. 너도 계획에 있다.”','「競争は公平だ。君も計画に入っている」'),()=>L('“결과로 말해.” 짧은 대답이 돌아왔다.','「結果で示せ」。短い答えが返ってきた。')]},
   {l:['이적도 고려한다','移籍も考える'],fx:()=>{D({reqT:1,tru:-4});return 0},r:[()=>L('에이전트에게 다음 창 준비를 지시했다.','代理人に次の移籍市場の準備を指示した。')]}]},
 {id:'pkdispute',w:1,c:()=>S.status==='pro'&&S.P.fame>=30&&S.P.pos!=='GK'&&!S.flags.pkTaker,
  t:[p=>L(`PK 상황에서 전담 키커 ${J(p.mate,'과','와')} 공을 두고 신경전이 벌어졌다. 중계 카메라가 다 잡았다.`,`PKの場面で、専任キッカーの${p.mate}とボールを巡って揉めた。中継カメラはすべて映していた。`)],
  ch:[{l:['양보한다','譲る'],fx:()=>{D({tea:4});return 0},r:[()=>L('경기 후 그가 고맙다며 하이파이브를 청했다.','試合後、彼は感謝のハイタッチを求めてきた。')]},
   {l:['내가 찬다','自分が蹴る'],fx:()=>{D({pkTaker:1,tea:-6,fame:1});return 0},r:[()=>L('감독이 이후 PK 전담을 공식적으로 지정했다. 이제 PK는 내가 찬다.','以降、監督はPKキッカーを正式に指名した。これからPKは自分が蹴る。')]}]},
 {id:'youtube',w:1,c:()=>S.P.fame>=20,
  t:[()=>L('구독자 230만 축구 유튜버가 콜라보 영상을 제안했다. 크로스바 챌린지와 인터뷰.','登録者230万人のサッカーYouTuberがコラボ動画を提案。クロスバーチャレンジとインタビュー。')],

const EVI=Object.fromEntries(EV.map(e=>[e.id,e]));
function drawEvents(){const P=S.P;S.events=[];S.flags.evLast=S.flags.evLast||{};const now=ymk(S.y,S.m);
 if(P.nat==='KOR'&&!P.mil.ex&&!P.mil.done&&S.status!=='mil'&&S.m===1&&age()>=27&&!(P.mil.def&&age()<28&&P.mil.defY===S.y)){
  const e={id:'military',vi:0,p:{},ci:null};if(P.mil.def||age()>=28)e.forced=1;S.events.push(e);if(P.mil.def)P.mil.defY=S.y}
 const pool=EV.filter(e=>e.w>0&&e.c()&&!(S.flags.evLast[e.id]&&now-S.flags.evLast[e.id]<8));
 const n=R()<.8?(R()<.3?2:1):0;
 for(let i=0;i<n&&pool.length;i++){const e=wpick(pool,x=>x.w);pool.splice(pool.indexOf(e),1);const r=mulberry32(randi(1,1e9));const p={mate:mate(r),media:S.club?CTY[CL[S.club].nat].media:CTY[S.P.nat]?CTY[S.P.nat].media:'',...(e.p?e.p():{})};S.events.push({id:e.id,vi:Math.floor(R()*e.t.length),p,ci:null});S.flags.evLast[e.id]=now}}
function resolveEvent(i,ci){const ev=S.events[i];if(!ev||ev.ci!==null)return;const e=EVI[ev.id];const P=S.P;const b={fame:P.fame,tru:P.tru,tea:P.tea,mor:P.mor,cond:P.cond,money:P.money};
 if(ev.id==='military'&&ci===1&&ev.forced)return;
 const ri=e.ch[ci].fx(ev.p)||0;ev.ci=ci;ev.ri=ri;ev.d={};for(const k in b){const d=(k==='money'?P.money:P[k])-b[k];if(Math.abs(d)>=.05)ev.d[k]=Math.round(d*10)/10}
 S.evDone.push({id:ev.id,vi:ev.vi,ci,ri,p:ev.p,d:ev.d})}
function evText(ev){const e=EVI[ev.id];return e.t[Math.min(ev.vi,e.t.length-1)](ev.p)}
function evResult(ev){const e=EVI[ev.id];const c=e.ch[ev.ci];return c.r[Math.min(ev.ri,c.r.length-1)](ev.p)}

 const r=mulberry32(o.seed||3);const g=c.createLinearGradient(0,0,0,150);g.addColorStop(0,'#050b16');g.addColorStop(1,'#1a2a42');c.fillStyle=g;c.fillRect(0,0,640,360);
 for(let i=0;i<14;i++){const yy=30+i*6;for(let j=0;j<150;j++){c.fillStyle=hexA(j%3?o.ok1||'#c8102e':'#d9d2c5',.35+.4*i/14);c.fillRect(j*4.3+r()*2,yy,2.4,2.4)}}
 for(let i=0;i<7;i++){c.fillStyle=i%2?'#2b7a43':'#256c3b';c.fillRect(0,150+i*30,640,30)}
 c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=2;c.beginPath();c.moveTo(60,255);c.lineTo(580,255);c.stroke();c.beginPath();c.moveTo(110,255);c.lineTo(70,360);c.moveTo(530,255);c.lineTo(570,360);c.stroke();
 c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1;for(let x=GOAL.x0;x<=GOAL.x1;x+=12){c.beginPath();c.moveTo(x,GOAL.y0);c.lineTo(x+(x-320)*.05,GOAL.y1);c.stroke()}for(let y=GOAL.y0;y<=GOAL.y1;y+=12){c.beginPath();c.moveTo(GOAL.x0,y);c.lineTo(GOAL.x1,y);c.stroke()}

 c.strokeStyle=col||'#e8ff3a';c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(-15,-56);c.lineTo(-38,-84);c.moveTo(15,-56);c.lineTo(38,-84);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(-40,-87,7,0,7);c.arc(40,-87,7,0,7);c.fill();

function pkSim(o){// returns {tx,ty,kx,ky,goal,post}
 const skill=o.skill||100;const sd=4+(150-skill)*.18+(o.pressure||0)*4;const tx=o.ax+gauss()*sd,ty=o.ay+gauss()*sd*.8;
 const dir=R()<.42?-1:R()<.72?1:0;const kx=320+dir*(100+R()*30),ky=dir?150+R()*90:150+R()*40;const reach=46+(o.gkq||0);
 const inX=tx>GOAL.x0+5&&tx<GOAL.x1-5,inY=ty>GOAL.y0+5&&ty<GOAL.y1;const post=!inX&&tx>GOAL.x0-8&&tx<GOAL.x1+8&&ty>GOAL.y0-8||(!inY&&ty<GOAL.y0+5&&ty>GOAL.y0-8&&tx>GOAL.x0&&tx<GOAL.x1);
 const onT=inX&&inY;const saved=onT&&Math.hypot(tx-kx,ty-ky)<reach;return {tx,ty,kx,ky,goal:onT&&!saved,saved,post:!onT&&post,miss:!onT&&!post}}
function animate(dur,fn){return new Promise(res=>{const t0=performance.now();function f(t){const p=Math.min(1,(t-t0)/dur);fn(p);if(p<1)requestAnimationFrame(f);else res()}requestAnimationFrame(f)})}

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

function serial(){return JSON.stringify(S,(k,v)=>k==='_dx'?undefined:v)}
function save(){if(!S)return;S._ts=Date.now();const j=serial();lsSet(SK,j);if(ST.db){clearTimeout(ST.tmr);ST.tmr=setTimeout(()=>cloudSave(j),1200)}}
async function cloudSave(j){try{let body=j;if(body.length>240000){const c=JSON.parse(body);c.rep=c.rep.slice(-6);body=JSON.stringify(c)}await ST.db.doc('data/users/'+ST.uid+'/save').set({json:body,ts:S?S._ts:Date.now()})}catch(e){}}
function loadLocal(){try{const s=lsGet(SK);if(!s)return null;const o=JSON.parse(s);return o&&o.v===2?o:null}catch(e){return null}}
function hofLocal(){try{return JSON.parse(lsGet(HK)||'[]')}catch(e){return []}}
function hofAdd(h){const list=hofLocal().filter(x=>x.id!==h.id);list.unshift(h);lsSet(HK,JSON.stringify(list.slice(0,40)));ST.hof=mergeHof(ST.hof,[h]);
 if(ST.db)ST.db.doc('data/users/'+ST.uid+'/hof').collection('items').doc(h.id).set({json:JSON.stringify(h),ts:Date.now()}).catch(()=>{})}
function mergeHof(a,b){const m={};[...a,...b].forEach(h=>{if(h&&h.id)m[h.id]=h});return Object.values(m).sort((x,y)=>(y.end[0]*12+y.end[1])-(x.end[0]*12+x.end[1]))}

 const snap=await db.doc('data/users/'+uid+'/save').get();if(snap.exists){const d=snap.data();if(d&&d.json){const local=loadLocal();if(!local||(d.ts||0)>(local._ts||0)){const o=JSON.parse(d.json);if(o&&o.v===2){S=o;reindex();lsSet(SK,d.json);if(UI.screen==='title')render()}}}}

 const app=document.getElementById('app');const sy=window.scrollY;app.innerHTML=renderTop()+body;drawCanvases(app);if(UI.keepScroll)window.scrollTo(0,sy);UI.keepScroll=0}
function startGame(opt){const d=UI.draft;newGame(d,opt);UI.screen='game';UI.tab='report';save();render();window.scrollTo(0,0)}
async function doAdvance(){if(UI.busy)return;UI.busy=1;try{const rep=await runMonth(IO);save();const f=document.getElementById('tk-foot');if(f&&!UI.auto){f.innerHTML=`<button class="btn go" id="tk-done">${L('리포트 보기','レポートを見る')}</button>`;await new Promise(r=>document.getElementById('tk-done').onclick=r)}modalClose();await ceremonies(rep)}catch(e){console.error(e);modalClose()}UI.busy=0;UI.tab='report';render();window.scrollTo(0,0)}
function act(a,el){const v=el?el.dataset.v:undefined;const P=S&&S.P;
 switch(a){
  case 'lang':UI.lang=v;lsSet(LK,v);UI.keepScroll=1;break;
  case 'home':UI.screen='title';UI.confirm=null;break;
  case 'auto':UI.auto=!UI.auto;lsSet(AK,UI.auto?'1':'0');UI.keepScroll=1;break;
  case 'toCreate':UI.screen='create';UI.draft=UI.draft||newDraft();break;
  case 'continue':UI.screen='game';UI.tab=S.rep.length?'report':'plan';break;
  case 'randName':UI.draft.name=NAMES[UI.draft.nat][randi(0,7)];UI.keepScroll=1;break;
  case 'randBody':{const b=randBody(UI.draft.nat,UI.draft.pos);UI.draft.h=b.h;UI.draft.w=b.w;UI.keepScroll=1;break}
  case 'randAll':{const nat=NATLIST[randi(0,NATLIST.length-1)],pos=POSL[randi(0,7)];const b=randBody(nat,pos);UI.draft={name:NAMES[nat][randi(0,7)],nat,age:randi(15,18),pos,foot:R()<.75?'R':'L',form:'abcde'[randi(0,4)],h:b.h,w:b.w};UI.keepScroll=1;break}
  case 'quickStart':{if(!UI.draft.name)UI.draft.name=NAMES[UI.draft.nat][randi(0,7)];const opts=academyOptions(UI.draft);startGame(opts[randi(0,opts.length-1)]);return}
  case 'set':{const k=el.dataset.k;UI.draft[k]=k==='age'?parseInt(v):v;if(k==='nat'||k==='pos'){const b=randBody(UI.draft.nat,UI.draft.pos);UI.draft.h=b.h;UI.draft.w=b.w}UI.keepScroll=1;break}
  case 'toAcad':UI.acad=academyOptions(UI.draft);UI.screen='academy';window.scrollTo(0,0);break;
  case 'pickAcad':startGame(UI.acad[parseInt(v)]);return;
  case 'tab':UI.tab=v;UI.confirm=null;window.scrollTo(0,0);break;
  case 'ev':resolveEvent(parseInt(v),parseInt(el.dataset.x));save();UI.keepScroll=1;break;
  case 'nego':{const o=el.dataset.k==='renew'?S.renew:S.offers[parseInt(v)];negotiateO(o,parseFloat(el.dataset.x));save();UI.keepScroll=1;break}
  case 'accept':acceptOffer(parseInt(v));save();render();showTransferPopup();return;
  case 'acceptRenew':acceptRenew();save();UI.keepScroll=1;break;
  case 'declineRenew':declineRenew();save();UI.keepScroll=1;break;
  case 'decline':declineOffers();save();UI.keepScroll=1;break;
  case 'num':P.num=parseInt(v);S.numOpts=null;save();UI.keepScroll=1;break;
  case 'tr':{const pl=S.plan;const i=pl.tr.indexOf(v);if(i>=0)pl.tr[i]=null;else{const j=pl.tr.indexOf(null);if(j>=0)pl.tr[j]=v}if(TR[v]&&TR[v].foc&&!TR[v].foc.includes(pl.foc))pl.foc=TR[v].foc[0];save();UI.keepScroll=1;break}
  case 'foc':S.plan.foc=v;save();UI.keepScroll=1;break;
  case 'pr':{const pl=S.plan;const i=pl.pr.indexOf(v);if(i>=0)pl.pr.splice(i,1);else pl.pr.push(v);save();UI.keepScroll=1;break}
  case 'biz':S.plan.biz=v||null;S.plan.bizX=1;UI.keepScroll=1;break;
  case 'bizX':S.plan.bizX=parseInt(v);UI.keepScroll=1;break;
  case 'advance':doAdvance();return;
  case 'tkSkip':TK.skip=1;return;
  case 'closeModal':modalClose();return;
  case 'askRetire':UI.confirm='retire';UI.keepScroll=1;break;
  case 'retire':{const h=finishCareer(v==='forced'?'forced':'vol');hofAdd(h);UI.hofView=h;UI.screen='end';UI.confirm=null;S=null;lsDel(SK);cloudClear();window.scrollTo(0,0);break}
  case 'hofView':UI.hofView=ST.hof.find(x=>x.id===v);UI.screen='end';window.scrollTo(0,0);break;
  case 'askNew':UI.confirm='new';break;
  case 'cancel':UI.confirm=null;UI.keepScroll=1;break;
  case 'doNew':S=null;lsDel(SK);cloudClear();UI.confirm=null;UI.draft=newDraft();UI.screen='create';window.scrollTo(0,0);break;
 }
 render()}
if(typeof document!=='undefined'){
 const l=lsGet(LK);if(l==='ja'||l==='ko')UI.lang=l;else if((navigator.language||'').startsWith('ja'))UI.lang='ja';UI.auto=lsGet(AK)==='1';
 S=loadLocal();if(S)reindex();ST.hof=hofLocal();
 const app=document.getElementById('app'),ov=document.getElementById('ov');
 const click=e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b)};
 app.addEventListener('click',click);ov.addEventListener('click',click);
 app.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;if(f==='name')UI.draft.name=e.target.value;else if(f==='h'||f==='w'){UI.draft[f]=parseInt(e.target.value);const sp=e.target.parentElement.querySelector('.num');if(sp)sp.textContent=e.target.value+(f==='h'?' cm':' kg')}});
 app.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;if(f==='life'||f==='scout'){S.plan[f]=parseInt(e.target.value);save();UI.keepScroll=1;render()}else if(f==='tableLg'){UI.tableLg=e.target.value;UI.keepScroll=1;render()}else if(f==='h'||f==='w'){UI.keepScroll=1;render()}});
 app.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.open&&d.dataset.rep){const k=+d.dataset.rep;const r=S.rep.find(x=>x.y*12+x.m===k);const inn=d.querySelector('.in');if(r&&!inn.innerHTML){inn.innerHTML=renderReport(r,true);drawCanvases(inn)}}},true);
 let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>drawCanvases(document),200)});
 render();initCloud();
}
